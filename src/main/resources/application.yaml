#Spring
spring:
  application:
    name: demo
  jackson:
    time-zone: Europe/Istanbul
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: true
  main:
    allow-circular-references: true
  datasource:
    url: 'jdbc:postgresql://localhost:5432/Demo'
    username: postgres
    password: test
  data:
    redis:
      host: localhost
      port: 6379
      database: 0

#Management
management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
    access:
      default: unrestricted

#Logging
logging:
  level:
    root: info
#  file:
#    name: logs/app.log
#  logback:
#    rollingpolicy:
#      max-file-size: 1KB
#      file-name-pattern: ${LOG_FILE}.%d{yyyy-MM-dd}.%i.gz

#Swagger
springdoc:
  swagger-ui:
    path: /swagger
    enabled: true
    display-request-duration: true
    filter: true
    # use-root-path: true       #localhost:8080 üzerinden swagger açar