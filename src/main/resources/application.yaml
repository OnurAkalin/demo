#Spring
spring:
  application:
    name: demo
  jackson:
    time-zone: Europe/Istanbul
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: true
    properties:
      hibernate:
        order_inserts: true
        order_updates: true
        jdbc:
          batch_size: 50
  main:
    allow-circular-references: true
    allow-bean-definition-overriding: true
  datasource:
    hikari:
      maximum-pool-size: 30  # Maks. eşzamanlı DB connection. Default: 10
      minimum-idle: 10  # Hazır bekleyen min. connection. Default: maximum-pool-size
      idle-timeout: 60_0000  # Boş connection kapanma süresi (ms). Default: 600000 (10dk)
      connection-timeout: 10000  # Connection bekleme süresi (ms). Default: 30000
      max-lifetime: 1_800_000  # Connection maksimum ömür (ms). Default: 1800000 (30dk)
      leak-detection-threshold: 20_000  # 20sn'den uzun tutulursa leak uyarısı. Default: 0 (kapalı)
    url: 'jdbc:postgresql://localhost:5432/Demo'
    username: postgres
    password: test
  data:
    redis:
      host: localhost
      password: redis-password
      port: 6379
      database: 0
  kafka:
    bootstrap-servers: localhost:9092
    listener:
      ack-mode: manual
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      enable-auto-commit: false

